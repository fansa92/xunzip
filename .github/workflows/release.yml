name: Release

# 推送 v* 标签即触发多架构交叉编译与 GitHub Release 发布。
# 例：git tag v1.3.0 && git push origin v1.3.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: 构建 ${{ matrix.goos }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, arch: amd64 }
          - { goos: linux, goarch: arm64, arch: arm64 }
          - { goos: linux, goarch: "386", arch: "386" }
          - { goos: linux, goarch: arm, goarm: "7", arch: armv7 }
          - { goos: linux, goarch: arm, goarm: "6", arch: armv6 }
          - { goos: windows, goarch: amd64, arch: amd64 }
          - { goos: windows, goarch: "386", arch: "386" }
          - { goos: windows, goarch: arm64, arch: arm64 }
          - { goos: darwin, goarch: amd64, arch: amd64 }
          - { goos: darwin, goarch: arm64, arch: arm64 }
          - { goos: freebsd, goarch: amd64, arch: amd64 }
          - { goos: freebsd, goarch: arm64, arch: arm64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 交叉编译并打包
        id: pack
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 版本号去掉前缀 v：-version 输出 "xunzip 1.3.0" 而不是 "xunzip v1.3.0"
          VERSION="${TAG#v}"
          NAME="xunzip_${VERSION}_${GOOS}_${{ matrix.arch }}"
          STAGE="staging/${NAME}"
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"

          mkdir -p "$STAGE"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "${STAGE}/xunzip${EXT}" .
          cp README.md "$STAGE/"

          # 只在 runner 能直接执行的组合上做版本自检（linux/amd64），
          # 避免出现"发版了但二进制里还是旧版本"这种哑巴故障。
          if [ "$GOOS" = "linux" ] && [ "$GOARCH" = "amd64" ]; then
            GOT="$("${STAGE}/xunzip" -version)"
            echo "版本自检: $GOT"
            case "$GOT" in
              *"${VERSION}"*) ;;
              *) echo "版本注入失败：期望包含 ${VERSION}，实际为 $GOT"; exit 1 ;;
            esac
          fi

          mkdir -p dist
          if [ "$GOOS" = "windows" ]; then
            (cd staging && zip -qr "../dist/${NAME}.zip" "$NAME")
            echo "asset=dist/${NAME}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "dist/${NAME}.tar.gz" -C staging "$NAME"
            echo "asset=dist/${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: xunzip-${{ matrix.goos }}-${{ matrix.arch }}
          path: ${{ steps.pack.outputs.asset }}
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 生成 SHA256 校验文件
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: xunzip ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
