name: CI

# 每次推送与 PR 都跑：格式、静态检查、当前平台功能测试，
# 再对全部发布目标做一次交叉编译冒烟，确保 tag 触发的 Release 不会在构建阶段翻车。
# 目标清单见 .github/targets.txt（CI 与 Release 共用）。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 格式 / vet / 功能测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt 检查
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 构建
        run: go build -trimpath -o /tmp/xunzip .

      - name: 冒烟测试（压缩解压往返）
        run: |
          set -euo pipefail
          X=/tmp/xunzip
          work="$(mktemp -d)"
          cd "$work"

          mkdir -p src/sub src/empty
          printf 'alpha\n' > src/a.txt
          printf 'beta\n'  > src/sub/b.txt
          : > src/zero.txt
          printf '中文\n' > src/中文名.txt
          head -c 200000 /dev/urandom > src/sub/rand.bin

          # 每个可写容器格式都要能打包、测试、原样解回来
          for f in zip 7z tar tar.gz tar.bz2 tar.xz tar.zst; do
            rm -f "arc.$f"
            "$X" a "arc.$f" src >/dev/null
            "$X" t "arc.$f" >/dev/null
            rm -rf "out.$f"
            "$X" x -o "out.$f" "arc.$f" >/dev/null
            diff -r src "out.$f/src" >/dev/null
            echo "往返一致: $f"
          done

          # 单文件流格式
          for f in gz bz2 xz zst lz4 br lz lzma; do
            rm -f "one.$f"
            "$X" a "one.$f" src/a.txt >/dev/null
            "$X" t "one.$f" >/dev/null
            echo "单文件流可用: $f"
          done

          # 包内增删改
          "$X" a mod.zip src >/dev/null
          "$X" d mod.zip src/a.txt >/dev/null
          "$X" rn mod.zip src/sub/b.txt src/sub/c.txt >/dev/null
          "$X" l -slt mod.zip >/dev/null
          "$X" l --json mod.zip >/dev/null

          # 加密 zip、分卷、管道、哈希
          "$X" a -p pw enc.zip src/a.txt >/dev/null
          rm -rf enc.out
          "$X" x -o enc.out -p pw enc.zip >/dev/null
          diff src/a.txt enc.out/src/a.txt >/dev/null

          "$X" a -v 64k vol.7z src >/dev/null
          test -f vol.7z.001
          rm -rf vol.out
          "$X" x -o vol.out vol.7z.001 >/dev/null
          diff -r src vol.out/src >/dev/null

          cat src/a.txt | "$X" a -si pipe.gz >/dev/null
          "$X" x -so pipe.gz > piped.txt
          diff src/a.txt piped.txt >/dev/null

          "$X" h -scrc SHA256 src/a.txt >/dev/null
          "$X" i >/dev/null
          "$X" -version

          echo "全部冒烟用例通过"

  cross:
    name: 交叉编译 ${{ matrix.family }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 与 Release 相同的平台族分组，每组内串行构建本组目标，组间并行。
        family: [linux, bsd, win-mac]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 遍历目标清单交叉编译
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          case "$FAMILY" in
            linux)   pattern='^(linux)$' ;;
            bsd)     pattern='^(freebsd|netbsd|openbsd)$' ;;
            win-mac) pattern='^(windows|darwin)$' ;;
            *)       echo "未知分组: $FAMILY"; exit 1 ;;
          esac

          # 先用同一份清单数出本组应有的目标数，编译后再比对，防止清单写歪导致静默漏编
          expected=0
          while IFS='|' read -r goos _; do
            case "$goos" in ''|'#'*) continue ;; esac
            if [[ "$goos" =~ $pattern ]]; then expected=$((expected + 1)); fi
          done < .github/targets.txt

          count=0
          while IFS='|' read -r goos goarch variant name; do
            case "$goos" in ''|'#'*) continue ;; esac
            [[ "$goos" =~ $pattern ]] || continue
            unset GOARM GOMIPS 2>/dev/null || true
            case "$goarch" in
              arm)         export GOARM="$variant" ;;   # 5/6/7
              mips|mipsle) export GOMIPS="$variant" ;;  # softfloat
            esac
            EXT=""
            [ "$goos" = windows ] && EXT=".exe"
            out="/tmp/xunzip_${goos}_${name}${EXT}"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w" -o "$out" .
            printf '  %-8s %-9s %6s KB\n' "$goos" "$name" "$(( $(stat -c%s "$out") / 1024 ))"
            count=$((count + 1))
          done < .github/targets.txt

          echo "分组 ${FAMILY} 完成：$count 个目标（清单预期 $expected）"
          test "$count" -gt 0
          test "$count" -eq "$expected"
